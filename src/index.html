<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Image search application using Pixabay API with pagination and interactive gallery view."
    />

    <title>Pixabay Image Search</title>

    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../assets/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../assets/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../assets/favicon-180x180.png"
    />
  </head>
  <body>
    <header>
      <form class="search-form" id="search-form">
        <input
          type="text"
          name="searchQuery"
          autocomplete="off"
          placeholder="Search images..."
          aria-label="Search images"
        />
        <button type="submit">Search</button>
      </form>
    </header>

    <main>
      <div class="gallery"></div>
      <button type="button" class="load-more" disabled>Load more</button>
    </main>

    <script src="index.js" type="module"></script>
  </body>
</html>
